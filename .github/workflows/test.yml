name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the docs against the files
        run: node scripts/verify-claims.mjs
